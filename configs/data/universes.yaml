# Universe per market (paper §4.1): GICS sectors as of 2025-03-31,
# top-5 by market cap (S&P500, CSI300) / top-4 (EUROSTOXX, KOSPI200).
# Hand-curated yfinance tickers. Stocks without full history over the split
# window are dropped automatically (regime_alloc/data/universe.py), so the
# final count can differ from the paper's 55/55/37/44.

macro:                       # Table 1 (shared across regions, US-quoted)
  dollar: DX-Y.NYB
  tnx: ^TNX                  # 10y yield
  irx: ^IRX                  # 13-week T-bill, proxy for 3m -> term spread = tnx - irx
  vix: ^VIX
  gold: GC=F

markets:
  sp500:
    region: US
    index: ^GSPC
    foreign_macro_lag: false # US series close at the same time as the market
    sectors:
      information_technology: [AAPL, MSFT, NVDA, AVGO, ORCL]
      communication_services: [GOOGL, META, NFLX, TMUS, DIS]
      consumer_discretionary: [AMZN, TSLA, HD, MCD, BKNG]
      consumer_staples: [WMT, COST, PG, KO, PM]
      energy: [XOM, CVX, COP, WMB, EOG]
      financials: [JPM, V, MA, BAC, WFC]
      health_care: [LLY, UNH, JNJ, ABBV, MRK]
      industrials: [GE, RTX, CAT, UNP, HON]
      materials: [LIN, SHW, ECL, APD, FCX]
      real_estate: [PLD, AMT, WELL, EQIX, SPG]
      utilities: [NEE, SO, DUK, AEP, D]

  csi300:
